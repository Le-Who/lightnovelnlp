[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ───────────────────────────────────────────────────────────────────
# Run ALL tests (default):        pytest
# Unit tests only:                pytest -m "not integration and not postgres"
# Integration (SQLite) only:      pytest -m integration
# Postgres tests (requires DB):   pytest -m postgres --postgres-url=<url>
# Skip postgres locally:          pytest -m "not postgres"

markers =
    unit: Pure unit tests — no DB, no network. Fast, deterministic.
    integration: Integration tests — SQLite in-memory, TestClient, mocked external services.
    postgres: Tests requiring a live PostgreSQL + pgvector instance (CI only).
    slow: Tests that take >1s and should be excluded from fast feedback loops.

# ── Default behaviour ─────────────────────────────────────────────────────────
# -p no:warnings → still show warnings in this project because we need to see
# the pydantic.v1 / Python 3.14 deprecation signals.
addopts =
    --strict-markers
    --tb=short
    -q

# ── asyncio ───────────────────────────────────────────────────────────────────
asyncio_mode = strict
